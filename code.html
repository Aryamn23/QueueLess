<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueueLess - Smart Queue Management</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#1e1b4b',
            },
            slate: {
              850: '#151f32',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .ticket-rip {
      background: radial-gradient(circle at center, transparent 7px, #ffffff 8px);
      background-size: 20px 20px;
    }
    /* Pulse badge */
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
    .turn-glow {
      box-shadow: 0 0 35px -5px rgba(99, 102, 241, 0.4);
    }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid rgba(99, 102, 241, .28);
      outline-offset: 2px;
    }
    button { min-height: 40px; transition: background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease; }
    button:active { transform: translateY(1px); }
    #app > * { animation: page-enter .22s ease-out both; }
    .queue-card { transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
    .queue-card:hover { border-color: #c7d2fe; box-shadow: 0 12px 28px rgba(79, 70, 229, .10); transform: translateY(-2px); }
    .empty-state { border: 1px dashed #cbd5e1; background: rgba(255, 255, 255, .72); }
    @keyframes page-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 767px) {
      body { font-size: 15px; }
      body > #app > .min-h-screen > header > div { height: auto; min-height: 5rem; padding-top: .75rem; padding-bottom: .75rem; flex-wrap: wrap; gap: .5rem; }
      body > #app > .min-h-screen > header nav { width: 100%; justify-content: flex-end; gap: .25rem; }
      body > #app > .min-h-screen > header nav button { padding: .5rem .65rem; font-size: .75rem; }
      header.sticky { position: static; }
      header .max-w-6xl { padding-left: 1rem; padding-right: 1rem; }
      header .h-16 { height: auto; min-height: 4.25rem; padding-top: .75rem; padding-bottom: .75rem; }
      header nav { width: 100%; gap: .25rem; justify-content: space-between; }
      header nav button { flex: 1 1 0; justify-content: center; padding-left: .4rem; padding-right: .4rem; min-height: 44px; }
      header nav button span { font-size: .72rem; }
      main > .max-w-6xl, main .max-w-6xl { padding-left: 1rem; padding-right: 1rem; padding-top: 1.25rem; padding-bottom: 1.5rem; }
      main .grid { grid-template-columns: minmax(0, 1fr) !important; }
      main .flex-col.md\:flex-row { align-items: stretch; }
      main .flex-col.md\:flex-row > button, main .flex-col.md\:flex-row > a { width: 100%; justify-content: center; }
      main .grid-cols-4, main .grid-cols-3, main .grid-cols-2 { grid-template-columns: minmax(0, 1fr) !important; }
      main .gap-6 { gap: 1rem; }
      main .gap-8 { gap: 1.25rem; }
      main h1 { font-size: 1.65rem; line-height: 1.15; }
      main h2 { font-size: 1.25rem; }
      main .text-5xl { font-size: 3.4rem; }
      main .overflow-x-auto { -webkit-overflow-scrolling: touch; }
      main table { min-width: 38rem; }
      form { width: 100%; }
      form input, form select, form textarea { min-height: 44px; font-size: 1rem; }
      [role="dialog"] > div, .fixed > div { max-height: calc(100vh - 2rem); overflow-y: auto; }
      .ticket-rip { background-size: 16px 16px; }
    }
    @media (min-width: 768px) and (max-width: 1100px) {
      main .max-w-6xl { padding-left: 1.5rem; padding-right: 1.5rem; }
      main .grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main .grid-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900 selection:bg-indigo-100 selection:text-indigo-900">

  <!-- Root App Container -->
  <div id="app" class="flex-1 flex flex-col">
    <!-- Rendered Dynamically via Vanilla JS State Machine -->
  </div>

  <script>
    /**
     * QUEUELESS WEB APPLICATION
     * Complete Frontend with Simulated Backend State, LocalStorage persistence,
     * Student Portal, Admin Portal, Live Ticket Simulation, Modal flows, Statistics, and Settings.
     */

    // --- APPLICATION STARTS EMPTY ---
    const INITIAL_SERVICES = [];
    const INITIAL_QUEUE_ENTRIES = [];
    const INITIAL_HISTORY = [];

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }

    async function apiRequest(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'X-QueueLess-Client-Id': store.clientId,
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'The server could not complete that request.');
      return data;
    }

    // --- APPLICATION STATE (Synced with localStorage) ---
    class AppStore {
      constructor() {
        this.loadState();
      }

      loadState() {
        try {
          const stored = localStorage.getItem('queueless_state_v1');
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed.schemaVersion !== 2) throw new Error('Old demo data detected');
            this.auth = parsed.auth || null;
            this.activeView = parsed.activeView || 'home';
            this.services = Array.isArray(parsed.services) ? parsed.services : [];
            this.queueEntries = Array.isArray(parsed.queueEntries) ? parsed.queueEntries : [];
            this.myTicket = parsed.myTicket || null;
            this.history = Array.isArray(parsed.history) ? parsed.history : [];
            this.settings = parsed.settings || {
              notifications: true,
              autoRefresh: true,
              avgServiceTime: 5,
              systemStatus: 'Local only'
            };
            this.managerId = parsed.managerId || `manager-${Date.now()}`;
            this.ticketCounter = parsed.ticketCounter || 0;
            this.selectedServiceForJoin = null;
            this.showCreateQueueModal = false;
            this.showPublicJoinForm = false;
            this.joinFormError = '';
            this.joinDraft = { queueName: '', userName: '', identifier: '' };
            this.clientId = parsed.clientId || localStorage.getItem('queueless_client_id') || crypto.randomUUID();
            this.managerClientId = parsed.managerClientId || this.clientId;
            this.services.forEach(service => this.syncQueue(service.id));
            this.saveState();
            return;
          }
        } catch (e) {
          localStorage.removeItem('queueless_state_v1');
        }

        // Defaults
        this.auth = null;
        this.activeView = 'home';
        this.services = [];
        this.queueEntries = [];
        this.myTicket = null;
        this.history = [];
        this.settings = {
          notifications: true,
          autoRefresh: true,
          avgServiceTime: 5,
          systemStatus: 'Local only'
        };
        this.managerId = `manager-${Date.now()}`;
        this.ticketCounter = 0;
        this.selectedServiceForJoin = null;
        this.showCreateQueueModal = false;
        this.showPublicJoinForm = false;
        this.joinFormError = '';
        this.joinDraft = { queueName: '', userName: '', identifier: '' };
        this.clientId = localStorage.getItem('queueless_client_id') || crypto.randomUUID();
        this.managerClientId = this.clientId;
        this.saveState();
      }

      saveState() {
        const payload = {
          schemaVersion: 2,
          auth: this.auth,
          activeView: this.activeView,
          services: this.services,
          queueEntries: this.queueEntries,
          myTicket: this.myTicket,
          history: this.history,
          settings: this.settings,
          managerId: this.managerId,
          clientId: this.clientId,
          managerClientId: this.managerClientId,
          ticketCounter: this.ticketCounter
        };
        try {
          localStorage.setItem('queueless_client_id', this.clientId);
          localStorage.setItem('queueless_state_v1', JSON.stringify(payload));
        } catch (e) {
          console.error("Failed to save state", e);
        }
      }

      useIdentity(name) {
        const normalized = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
        this.clientId = `visitor-${normalized || crypto.randomUUID()}`;
        localStorage.setItem('queueless_client_id', this.clientId);
      }

      applyQueue(queue) {
        if (!queue) return;
        const service = {
          id: queue.id,
          name: queue.name,
          description: queue.description || '',
          avgServiceTime: queue.serviceTime,
          serviceTime: queue.serviceTime,
          waitingCount: queue.waitingCount || 0,
          currentServingTicket: queue.members?.find(member => member.status === 'serving')?.id || 'None',
          status: String(queue.status || 'open').toUpperCase(),
          counter: 'Queue counter',
          ownerId: queue.owned === false ? 'remote' : this.managerClientId
        };
        this.services = [...this.services.filter(item => item.id !== service.id), service];
        if (queue.members) {
          const entries = queue.members.map(member => ({
            id: member.id,
            ticket: member.id,
            serviceId: queue.id,
            serviceName: queue.name,
            user: member.name,
            joinedTime: new Date(member.joinedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            joinedAt: new Date(member.joinedAt).getTime(),
            position: member.position,
            status: member.status === 'serving' ? 'CALLED' : 'WAITING',
            counter: 'Queue counter'
          }));
          this.queueEntries = [...this.queueEntries.filter(entry => entry.serviceId !== queue.id), ...entries];
        }
      }

      login(role, email = '') {
        if (role === 'admin') {
          this.auth = {
            role: 'admin',
            name: 'Queue manager',
            email: email || ''
          };
          this.activeView = 'admin-dashboard';
        } else {
          this.auth = {
            role: 'student',
            name: email || 'Visitor'
          };
          // If already has ticket, go to my-queue or dashboard
          this.activeView = this.myTicket ? 'student-my-queue' : 'student-dashboard';
        }
        this.saveState();
        renderApp();
      }

      logout() {
        this.auth = null;
        this.activeView = 'home';
        this.saveState();
        renderApp();
      }

      navigate(view) {
        this.activeView = view;
        this.saveState();
        renderApp();
      }

      openPublicJoinForm() {
        this.joinFormError = '';
        this.joinDraft = { queueName: '', userName: '', identifier: '' };
        this.showPublicJoinForm = true;
        renderApp();
      }

      closePublicJoinForm() {
        this.joinFormError = '';
        this.joinDraft = { queueName: '', userName: '', identifier: '' };
        this.showPublicJoinForm = false;
        renderApp();
      }

      openCreateQueue() {
        this.showCreateQueueModal = true;
        renderApp();
      }

      async openManager() {
        this.clientId = this.managerClientId;
        this.auth = { role: 'admin', name: 'Queue manager' };
        this.activeView = 'admin-dashboard';
        this.saveState();
        renderApp();
        try {
          const queues = await apiRequest('/api/queues');
          queues.forEach(queue => this.applyQueue(queue));
          this.saveState();
          renderApp();
        } catch (error) {
          this.joinFormError = error.message;
          renderApp();
        }
      }

      async joinFromPublicForm(queueName, userName, identifier = '') {
        const cleanQueueName = queueName.trim();
        const cleanUserName = userName.trim();
        this.joinDraft = { queueName: cleanQueueName, userName: cleanUserName, identifier: identifier.trim() };
        if (!cleanQueueName || !cleanUserName) {
          this.joinFormError = 'Enter both the queue name and your name.';
          renderApp();
          return;
        }

        try {
          this.useIdentity(cleanUserName);
          const queues = await apiRequest('/api/queues');
          const service = queues.find(item => item.name.toLowerCase() === cleanQueueName.toLowerCase());
          if (!service) {
            this.joinFormError = `Queue not found. Create “${cleanQueueName}” instead.`;
            renderApp();
            return;
          }
          if (service.status !== 'open') {
            this.joinFormError = service.status === 'closed' ? 'Queue has been closed. Nobody can join it.' : 'Queue is currently paused. New people cannot join yet.';
            renderApp();
            return;
          }
          this.auth = { role: 'student', name: cleanUserName, identifier: identifier.trim() };
          const joined = await apiRequest(`/api/queues/${service.id}/join`, {
            method: 'POST', body: JSON.stringify({ name: cleanUserName, identifier })
          });
          this.applyQueue(joined.queue);
          this.myTicket = { entryId: joined.member.id, ticket: joined.member.id.slice(0, 8), serviceId: service.id, serviceName: service.name, position: joined.member.position, initialPosition: joined.member.position, estimatedWait: joined.member.estimatedWait, joinedTime: new Date(joined.member.joinedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), counter: 'Queue counter', avgServiceTime: service.serviceTime, status: joined.member.status === 'serving' ? 'CALLED' : 'WAITING' };
          this.showPublicJoinForm = false;
          this.joinFormError = '';
          this.joinDraft = { queueName: '', userName: '', identifier: '' };
          this.activeView = 'student-my-queue';
          this.saveState();
          renderApp();
        } catch (error) {
          this.joinFormError = error.message;
          renderApp();
        }
      }

      openJoinModal(serviceId) {
        const service = this.services.find(s => s.id === serviceId);
        if (service) {
          this.selectedServiceForJoin = service;
          renderApp();
        }
      }

      closeJoinModal() {
        this.selectedServiceForJoin = null;
        renderApp();
      }

      syncQueue(serviceId) {
        const service = this.services.find(item => item.id === serviceId);
        if (!service) return;
        const waiting = this.queueEntries
          .filter(entry => entry.serviceId === serviceId && entry.status === 'WAITING')
          .sort((first, second) => (first.joinedAt || 0) - (second.joinedAt || 0));
        waiting.forEach((entry, index) => { entry.position = index + 1; });
        service.waitingCount = waiting.length;
        const serving = this.queueEntries.find(entry => entry.serviceId === serviceId && (entry.status === 'CALLED' || entry.status === 'SERVING'));
        service.currentServingTicket = serving ? serving.ticket : 'None';
        if (this.myTicket && this.myTicket.serviceId === serviceId) {
          const currentEntry = this.queueEntries.find(entry => entry.id === this.myTicket.entryId);
          if (currentEntry) {
            this.myTicket.position = currentEntry.status === 'WAITING' ? currentEntry.position : 0;
            this.myTicket.status = currentEntry.status;
            this.myTicket.estimatedWait = currentEntry.status === 'WAITING'
              ? Math.max(0, currentEntry.position - 1) * this.myTicket.avgServiceTime
              : 0;
          }
        }
      }

      async confirmJoinQueue() {
        if (!this.selectedServiceForJoin) return;
        const service = this.selectedServiceForJoin;
        if (!this.auth?.name) { alert('Enter your name before joining a queue.'); return; }
        try {
          this.useIdentity(this.auth.name);
          const joined = await apiRequest(`/api/queues/${service.id}/join`, { method: 'POST', body: JSON.stringify({ name: this.auth.name, identifier: this.auth.identifier || '' }) });
          this.applyQueue(joined.queue);
          this.myTicket = { entryId: joined.member.id, ticket: joined.member.id.slice(0, 8), serviceId: service.id, serviceName: service.name, position: joined.member.position, initialPosition: joined.member.position, estimatedWait: joined.member.estimatedWait, joinedTime: new Date(joined.member.joinedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), counter: service.counter, avgServiceTime: service.avgServiceTime, status: joined.member.status === 'serving' ? 'CALLED' : 'WAITING' };
          this.selectedServiceForJoin = null;
          this.activeView = 'student-my-queue';
          this.saveState();
          renderApp();
        } catch (error) { alert(error.message); }
      }

      async leaveQueue() {
        if (!this.myTicket) return;
        try {
          const result = await apiRequest(`/api/queue-members/${this.myTicket.entryId}?action=leave`, { method: 'POST' });
          this.applyQueue(result);
          this.history.unshift({ id: `h-${Date.now()}`, ticket: this.myTicket.ticket, service: this.myTicket.serviceName, date: 'Today', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), status: 'CANCELLED', waitTime: `${this.myTicket.estimatedWait} min` });
          this.myTicket = null;
          this.activeView = 'student-dashboard';
          this.saveState();
          renderApp();
        } catch (error) { alert(error.message); }
      }

      async refreshTicketPosition() {
        if (!this.myTicket || !this.myTicket.entryId) return;
        try {
          const member = await apiRequest(`/api/queues/${this.myTicket.serviceId}/position`);
          this.myTicket.position = member.position;
          this.myTicket.estimatedWait = member.estimatedWait;
          this.myTicket.status = member.status === 'serving' ? 'CALLED' : 'WAITING';
          this.saveState();
          renderApp();
        } catch (error) { alert(error.message); }
      }

      finishTurn() {
        if (!this.myTicket) return;

        // Add to completed history
        this.history.unshift({
          id: 'h-' + Date.now(),
          ticket: this.myTicket.ticket,
          service: this.myTicket.serviceName,
          date: 'Today',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: 'COMPLETED',
          waitTime: `${this.myTicket.initialPosition * (this.myTicket.avgServiceTime || 4)} min`
        });

        // Remove from live queue
        this.queueEntries = this.queueEntries.filter(e => e.ticket !== this.myTicket.ticket);

        this.syncQueue(this.myTicket.serviceId);

        this.myTicket = null;
        this.activeView = 'student-history';
        this.saveState();
        renderApp();
      }

      // --- Admin Actions ---
      async adminCallNext(serviceId) {
        try {
          const result = await apiRequest(`/api/queues/${serviceId}/next`, { method: 'POST' });
          this.applyQueue(result.queue);
          if (!result.member) { alert('No one is waiting in this queue.'); return; }
          if (this.myTicket && this.myTicket.entryId === result.member.id) { this.myTicket.position = 0; this.myTicket.status = 'CALLED'; this.myTicket.estimatedWait = 0; }
          this.saveState();
          renderApp();
        } catch (error) { alert(error.message); }
      }

      adminCompleteEntry(entryId) {
        const entry = this.queueEntries.find(e => e.id === entryId);
        if (!entry) return;
        entry.status = 'COMPLETED';

        this.syncQueue(entry.serviceId);

        if (this.myTicket && this.myTicket.ticket === entry.ticket) {
          this.finishTurn();
          return;
        }

        this.history.unshift({
          id: 'h-' + Date.now(),
          ticket: entry.ticket,
          service: entry.serviceName,
          date: 'Today',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: 'COMPLETED',
          waitTime: '8 min'
        });

        this.saveState();
        renderApp();
      }

      async toggleQueue(serviceId) {
        const service = this.services.find(item => item.id === serviceId);
        if (!service) return;
        if (service.status === 'CLOSED') return;
        try {
          const action = service.status === 'ACTIVE' ? 'pause' : 'resume';
          const queue = await apiRequest(`/api/queues/${serviceId}/${action}`, { method: 'POST' });
          this.applyQueue(queue); this.saveState(); renderApp();
        } catch (error) { alert(error.message); }
      }

      async closeQueue(serviceId) {
        const service = this.services.find(item => item.id === serviceId);
        if (!service) return;
        if (!confirm(`Close ${service.name}? People will no longer be able to join it.`)) return;
        try { const queue = await apiRequest(`/api/queues/${serviceId}/close`, { method: 'POST' }); this.applyQueue(queue); this.saveState(); renderApp(); } catch (error) { alert(error.message); }
      }

      removeQueue(serviceId) {
        const service = this.services.find(item => item.id === serviceId);
        if (!service || this.services.length <= 1) return;
        if (!confirm(`Remove ${service.name}? This only removes the local queue from this browser.`)) return;
        this.services = this.services.filter(item => item.id !== serviceId);
        this.queueEntries = this.queueEntries.filter(entry => entry.serviceId !== serviceId);
        if (this.myTicket && this.myTicket.serviceId === serviceId) this.myTicket = null;
        this.saveState();
        renderApp();
      }

      adminSkipEntry(entryId) {
        const entry = this.queueEntries.find(e => e.id === entryId);
        if (!entry) return;
        entry.status = 'WAITING';
        entry.joinedAt = Date.now();
        this.syncQueue(entry.serviceId);

        this.saveState();
        renderApp();
      }

      async adminRemoveEntry(entryId) {
        const entry = this.queueEntries.find(e => e.id === entryId);
        if (!entry) return;
        try { const queue = await apiRequest(`/api/queues/${entry.serviceId}/members/remove`, { method: 'POST', body: JSON.stringify({ memberId: entry.id }) }); this.applyQueue(queue); if (this.myTicket?.entryId === entry.id) this.myTicket = null; this.saveState(); renderApp(); } catch (error) { alert(error.message); }
      }

      async createQueue(name, description, avgServiceTime, capacity = '') {
        try {
          this.clientId = this.managerClientId;
          const queue = await apiRequest('/api/queues', { method: 'POST', body: JSON.stringify({ name, description, serviceTime: Number(avgServiceTime) }) });
          this.applyQueue(queue);
        } catch (error) {
          alert(error.message);
          return;
        }
        this.showCreateQueueModal = false;
        if (!this.auth) this.auth = { role: 'admin', name: 'Queue manager' };
        this.activeView = 'admin-dashboard';
        this.saveState();
        renderApp();
      }
    }

    const store = new AppStore();

    // --- TEMPLATES / COMPONENTS ---

    // Brand Logo Helper
    function renderLogo(size = 'normal') {
      const isLarge = size === 'large';
      return `
        <div class="flex items-center gap-2.5">
          <div class="${isLarge ? 'w-11 h-11' : 'w-9 h-9'} rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
            <i data-lucide="layers" class="${isLarge ? 'w-6 h-6' : 'w-5 h-5'}"></i>
          </div>
          <div>
            <span class="${isLarge ? 'text-2xl' : 'text-xl'} font-bold tracking-tight text-slate-900">Queue<span class="text-indigo-600">Less</span></span>
            <span class="block text-[10px] uppercase font-bold tracking-widest text-slate-400 -mt-1">Smart Flow</span>
          </div>
        </div>
      `;
    }

    // --- MAIN RENDER FUNCTION ---
    function renderApp() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      const view = store.activeView;

      let html = '';

      if (view === 'login' || !store.auth) {
        html = renderLoginView();
      } else if (view.startsWith('admin-')) {
        // Render Admin shell
        let inner = '';
        if (view === 'admin-dashboard') inner = renderAdminDashboardContent();
        else if (view === 'admin-queue-management') inner = renderAdminQueueManagementContent();
        else if (view === 'admin-history') inner = renderHistoryView();
        else if (view === 'admin-statistics') inner = renderAdminStatisticsContent();
        else if (view === 'admin-settings') inner = renderAdminSettingsContent();
        else inner = renderAdminDashboardContent();

        html = renderAdminLayout(inner);
      } else {
        // Render Student Portal
        let studentContent = '';
        if (view === 'student-dashboard') studentContent = renderStudentDashboard();
        else if (view === 'student-my-queue') studentContent = renderMyQueueView();
        else if (view === 'student-history') studentContent = renderHistoryView();
        else if (view === 'student-profile') studentContent = renderProfileView();
        else studentContent = renderStudentDashboard();

        html = `
          ${renderStudentNav()}
          <main class="flex-1 flex flex-col">
            ${studentContent}
          </main>
        `;
      }

      // Modals
      html += renderPublicJoinForm();
      html += renderJoinModal();
      html += renderCreateQueueModal();

      appEl.innerHTML = html;

      // Re-initialize icons
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    // Initial render on boot
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
